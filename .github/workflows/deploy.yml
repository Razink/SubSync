name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/subplayer
            cd /var/www/subplayer
            # Pull latest file directly via git
            if [ -d ".git" ]; then
              git pull origin master
            else
              git clone https://${{ secrets.GH_TOKEN }}@github.com/Razink/SubSync.git .
            fi
            echo "✅ Deploy done — $(date)"
