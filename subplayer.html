<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0d0f14">
  <title>SubPlayer</title>
  <style>
    :root {
      --bg: #0d0f14; --card: #161820; --card2: #1e202a;
      --gold: #c9a227; --gold2: #e6b84a;
      --text: #e8e8e8; --muted: #6b7280; --border: #2a2d3a;
      --green: #22c55e; --red: #ef4444; --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    #app { height: 100%; display: flex; flex-direction: column; }

    /* ── SETUP ── */
    .setup { flex: 1; overflow-y: auto; padding: 28px 20px 120px; }
    .logo { margin-bottom: 36px; }
    .logo h1 { font-size: 44px; font-style: italic; font-weight: 800;
      color: var(--gold); letter-spacing: -1px; line-height: 1; }
    .logo p { font-size: 11px; letter-spacing: 3px; color: var(--muted); margin-top: 6px; }
    .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
    .sec { margin-bottom: 28px; }

    .drop { border: 1.5px dashed var(--border); border-radius: var(--r);
      background: var(--card); padding: 32px 20px; text-align: center;
      cursor: pointer; position: relative; transition: border-color .2s, background .2s; }
    .drop.ok { border-color: var(--gold); background: rgba(201,162,39,.08); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop .ico { font-size: 38px; margin-bottom: 8px; }
    .drop .dtitle { font-size: 16px; font-weight: 500; }
    .drop .dsub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .drop.ok .dtitle { color: var(--gold); }

    .hint-box { background: var(--card); border-radius: var(--r); padding: 16px;
      font-size: 13px; color: var(--muted); line-height: 1.7; }
    .hint-box strong { color: var(--text); }

    .launch-wrap { position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 65%, transparent); }
    .lbtn { width: 100%; padding: 20px; border-radius: var(--r); border: none;
      background: var(--card2); color: var(--muted); font-size: 18px;
      font-style: italic; font-weight: 600; letter-spacing: .5px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .2s, color .2s; }
    .lbtn.ready { background: var(--gold); color: #000; }
    .lbtn.ready:active { background: var(--gold2); }

    /* ── PLAYER ── */
    .player { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
    .p-top { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
    .back { width: 44px; height: 44px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.1); color: var(--text); font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .p-name { font-size: 13px; color: var(--muted); max-width: 160px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-time { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .sub-area { flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 20px; }
    .sub-text { font-size: 30px; font-weight: 500; color: #fff; text-align: center;
      line-height: 1.45; text-shadow: 0 2px 10px rgba(0,0,0,.9); min-height: 80px; }
    .sub-text.blank { color: rgba(255,255,255,.12); font-size: 18px; }

    .nudge { display: flex; align-items: center; justify-content: center;
      gap: 14px; padding: 0 20px 10px; }
    .nBtn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      color: var(--text); border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
    .nBtn:active { background: rgba(255,255,255,.18); }
    .nLbl { font-size: 12px; color: var(--muted); }

    .prog { padding: 0 20px; margin-bottom: 6px; }
    .prog-bar { width: 100%; height: 4px; background: rgba(255,255,255,.15);
      border-radius: 2px; cursor: pointer; }
    .prog-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; }
    .prog-times { display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted); margin-top: 6px; }

    .ctrls { display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 12px 20px 8px; }
    .cw { display: flex; flex-direction: column; align-items: center; }
    .cbtn { border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .cbtn.sm { width: 56px; height: 56px; font-size: 20px;
      background: rgba(255,255,255,.08); color: var(--text); }
    .cbtn.sm:active { background: rgba(255,255,255,.2); }
    .cbtn.lg { width: 72px; height: 72px; font-size: 28px; background: var(--gold); color: #000; }
    .cbtn.lg:active { background: var(--gold2); }
    .clbl { font-size: 10px; color: var(--muted); margin-top: 5px; }

    /* Sync row — full width, well visible */
    .sync-row {
      padding: 0 20px calc(16px + env(safe-area-inset-bottom));
    }
    .sync-row-btn {
      width: 100%; padding: 15px; border-radius: var(--r); border: none;
      background: rgba(34,197,94,.12); color: var(--green);
      border: 1.5px solid rgba(34,197,94,.3);
      font-size: 16px; font-weight: 600; letter-spacing: .5px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .15s;
    }
    .sync-row-btn:active { background: rgba(34,197,94,.25); }

    /* ── SYNC OVERLAY ── */
    .sync-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 24px; z-index: 10; }
    .sync-overlay.hidden { display: none; }

    .mic-ring { width: 88px; height: 88px; border-radius: 50%;
      background: rgba(34,197,94,.1); border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 24px; position: relative; }
    .mic-ring.pulse::before { content: ''; position: absolute; inset: -8px;
      border-radius: 50%; border: 2px solid rgba(34,197,94,.4);
      animation: ripple 1.2s ease-out infinite; }
    .mic-ring.pulse::after { content: ''; position: absolute; inset: -16px;
      border-radius: 50%; border: 2px solid rgba(34,197,94,.2);
      animation: ripple 1.2s ease-out .4s infinite; }
    @keyframes ripple { 0% { transform: scale(.9); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; } }

    .sync-title { font-size: 13px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
    .sync-status { font-size: 18px; font-weight: 600; color: var(--text);
      margin-bottom: 20px; text-align: center; min-height: 28px; }
    .sync-status.ok  { color: var(--green); }
    .sync-status.err { color: var(--red); }

    .transcript-box { width: 100%; background: var(--card); border-radius: 12px;
      padding: 14px 16px; min-height: 80px; font-size: 14px; color: var(--muted);
      line-height: 1.6; margin-bottom: 24px; font-style: italic; }
    .transcript-box span { color: var(--text); }

    .sync-progress { width: 100%; height: 3px; background: rgba(255,255,255,.1);
      border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
    .sync-progress-fill { height: 100%; background: var(--green);
      border-radius: 2px; transition: width .5s linear; width: 0%; }

    .sync-actions { display: flex; gap: 12px; width: 100%; }
    .sync-cancel { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; }
    .sync-cancel:active { background: var(--card); }
    .sync-retry { flex: 1; padding: 14px; border-radius: 12px; border: none;
      background: var(--gold); color: #000; font-size: 15px; font-weight: 600;
      cursor: pointer; display: none; }
    .sync-retry:active { background: var(--gold2); }
    .sync-retry.show { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--muted);
      border-top-color: var(--text); border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const S = {
  screen: 'setup',
  subs: [], srtName: '', lang: 'fr-FR',
  currentTime: 0, isPlaying: false,
  syncOpen: false,
  syncPhase: 'idle', // idle | listening | searching | done | err | nospeech
  syncCountdown: 15,
  transcript: '',
};

let timerRaf = null, lastTick = null;
let recognition = null, cdInterval = null;

// ─────────────────────────────────────────
// SRT PARSER
// ─────────────────────────────────────────
function parseSRT(txt) {
  const out = [];
  for (const block of txt.trim().split(/\n\s*\n/)) {
    const lines = block.trim().split('\n');
    const tl = lines.find(l => l.includes('-->'));
    if (!tl) continue;
    const m = tl.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/);
    if (!m) continue;
    const start = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
    const end   = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/1000;
    const text  = lines.slice(lines.indexOf(tl)+1).join('\n').replace(/<[^>]+>/g,'').trim();
    if (text) out.push({ start, end, text });
  }
  return out;
}

function detectLang(subs) {
  const sample = subs.slice(0, 30).map(s => s.text).join(' ').toLowerCase();
  const fr = ['je','tu','il','elle','nous','vous','les','des','que','pas','une','est'].filter(w => sample.includes(' '+w+' ')).length;
  const en = ['the','and','you','that','this','with','have','they','from','were'].filter(w => sample.includes(' '+w+' ')).length;
  const ar = ['في','من','على','هذا','أن','كان'].filter(w => sample.includes(w)).length;
  if (ar > 1) return 'ar-SA';
  return fr >= en ? 'fr-FR' : 'en-US';
}

// ─────────────────────────────────────────
// TEXT MATCHING
// ─────────────────────────────────────────
const STOP = new Set(['le','la','les','de','du','un','une','et','est','je','tu','il','elle',
  'nous','vous','ils','elles','en','au','aux','se','sa','son','ce','si','ne','pas','plus','que',
  'qui','à','the','a','an','and','is','are','i','you','he','she','we','they','it','to','of',
  'in','that','was','for','on','with','as','his','her','but','be','not','no','so','do','did']);

function clean(text) {
  return text.toLowerCase()
    .replace(/['']/g,"'")
    .replace(/[^a-záàâäéèêëîïôùûüç'\s]/gi,' ')
    .replace(/\s+/g,' ').trim();
}
function sig(text) {
  return clean(text).split(' ').filter(w => w.length > 2 && !STOP.has(w));
}

function findPosition(transcript, subs) {
  const tw = sig(transcript);
  if (tw.length < 2) return null;

  let best = null, bestScore = 0;

  // Try windows of 4 to 8 subtitles
  for (let W = 4; W <= 8; W++) {
    for (let i = 0; i <= subs.length - W; i++) {
      const chunk = subs.slice(i, i+W).map(s => s.text).join(' ');
      const cw = sig(chunk);
      const cSet = new Set(cw);
      const matches = tw.filter(w => cSet.has(w)).length;
      const score = matches / Math.max(tw.length, 1);
      if (score > bestScore) {
        bestScore = score;
        best = { time: subs[i].start, score, subIdx: i };
      }
    }
  }
  return bestScore >= 0.18 ? best : null;
}

// ─────────────────────────────────────────
// SPEECH RECOGNITION SYNC
// ─────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function startSync() {
  if (!SR) {
    S.syncPhase = 'err';
    S.syncOpen = true;
    renderSyncOverlay('La reconnaissance vocale n\'est pas disponible sur ce navigateur.');
    return;
  }

  S.transcript = '';
  S.syncPhase = 'listening';
  S.syncCountdown = 15;
  S.syncOpen = true;
  renderSyncOverlay();

  recognition = new SR();
  recognition.lang = S.lang;
  recognition.continuous = true;
  recognition.interimResults = true;

  let finalTranscript = '';

  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (finalTranscript += ' ' + t) : (interim += t);
    }
    S.transcript = (finalTranscript + ' ' + interim).trim();
    const el = document.getElementById('live-transcript');
    if (el) el.innerHTML = S.transcript
      ? `<span>${S.transcript}</span>`
      : '<em>En attente de la voix…</em>';
  };

  recognition.onerror = e => {
    if (e.error === 'not-allowed') {
      stopSync();
      S.syncPhase = 'err';
      renderSyncOverlay('Accès au micro refusé. Autorise le micro dans les paramètres Chrome.');
    }
  };

  recognition.start();

  // Countdown
  cdInterval = setInterval(() => {
    S.syncCountdown--;
    const el = document.getElementById('sync-cd');
    const pf = document.getElementById('sync-pf');
    if (el) el.textContent = S.syncCountdown > 0 ? `Écoute… ${S.syncCountdown}s` : 'Traitement…';
    if (pf) pf.style.width = ((15 - S.syncCountdown) / 15 * 100) + '%';
    if (S.syncCountdown <= 0) finishSync();
  }, 1000);
}

function finishSync() {
  clearInterval(cdInterval);
  recognition?.stop();
  recognition = null;

  S.syncPhase = 'searching';
  const statusEl = document.getElementById('sync-cd');
  if (statusEl) statusEl.textContent = 'Recherche dans les sous-titres…';

  setTimeout(() => {
    const result = findPosition(S.transcript, S.subs);
    if (result) {
      S.currentTime = result.time;
      S.syncPhase = 'done';
      const conf = Math.round(result.score * 100);
      renderSyncOverlay(`✓ Position trouvée : ${fmt(result.time)} (${conf}% de correspondance)`);
      // Auto-close after 2s and resume playback
      setTimeout(() => {
        S.syncOpen = false;
        S.syncPhase = 'idle';
        renderPlayerScreen();
        if (!S.isPlaying) {
          S.isPlaying = true;
          startTimer();
          const pp = document.getElementById('pp');
          if (pp) pp.textContent = '⏸';
        }
      }, 2000);
    } else {
      S.syncPhase = 'nospeech';
      renderSyncOverlay(S.transcript.length < 10
        ? 'Pas de voix détectée. Approche-toi du son et réessaie.'
        : 'Aucune correspondance trouvée. Réessaie sur un passage avec des dialogues.');
    }
  }, 300);
}

function stopSync() {
  clearInterval(cdInterval);
  recognition?.stop();
  recognition = null;
  S.syncOpen = false;
  S.syncPhase = 'idle';
  renderPlayerScreen();
}

function renderSyncOverlay(statusMsg) {
  const overlay = document.getElementById('sync-overlay');
  if (!overlay) return;
  overlay.classList.remove('hidden');

  const isListening = S.syncPhase === 'listening';
  const isDone = S.syncPhase === 'done';
  const isErr = S.syncPhase === 'err' || S.syncPhase === 'nospeech';
  const isSearching = S.syncPhase === 'searching';

  let statusCls = '';
  if (isDone) statusCls = 'ok';
  if (isErr) statusCls = 'err';

  let statusText = statusMsg || (isListening ? `Écoute… ${S.syncCountdown}s` : '');
  if (isSearching) statusText = '<span class="spinner"></span> Recherche…';

  overlay.innerHTML = `
    <div class="sync-title">SYNCHRONISATION</div>
    <div class="mic-ring ${isListening ? 'pulse' : ''}">🎤</div>
    <div class="sync-status ${statusCls}" id="sync-cd">${statusText}</div>

    <div class="transcript-box">
      <div id="live-transcript">${
        S.transcript
          ? `<span>${S.transcript}</span>`
          : isDone || isErr ? '' : '<em>En attente de la voix…</em>'
      }</div>
    </div>

    <div class="sync-progress">
      <div class="sync-progress-fill" id="sync-pf"
        style="width:${isListening ? ((15 - S.syncCountdown)/15*100) : isDone ? 100 : 0}%">
      </div>
    </div>

    <div class="sync-actions">
      <button class="sync-cancel" id="sync-cancel">
        ${isDone ? 'Fermer' : 'Annuler'}
      </button>
      <button class="sync-retry ${isErr || S.syncPhase==='nospeech' ? 'show' : ''}" id="sync-retry">
        Réessayer
      </button>
    </div>`;

  document.getElementById('sync-cancel')?.addEventListener('click', stopSync);
  document.getElementById('sync-retry')?.addEventListener('click', () => {
    S.syncPhase = 'idle';
    startSync();
  });
}

// ─────────────────────────────────────────
// PLAYER TIMER
// ─────────────────────────────────────────
function startTimer() {
  lastTick = performance.now();
  function tick(now) {
    S.currentTime += (now - lastTick) / 1000;
    lastTick = now;
    updatePlayerUI();
    timerRaf = requestAnimationFrame(tick);
  }
  timerRaf = requestAnimationFrame(tick);
}
function stopTimer() {
  if (timerRaf) { cancelAnimationFrame(timerRaf); timerRaf = null; }
}

function updatePlayerUI() {
  const t = S.currentTime;
  const total = S.subs[S.subs.length-1]?.end || 1;
  const sub = S.subs.find(s => t >= s.start && t <= s.end);
  const el = id => document.getElementById(id);
  if (el('p-time'))    el('p-time').textContent = fmt(t);
  if (el('p-elapsed')) el('p-elapsed').textContent = fmt(t);
  if (el('p-total'))   el('p-total').textContent = fmt(total);
  if (el('p-fill'))    el('p-fill').style.width = Math.min(100, t/total*100) + '%';
  const st = el('sub-text');
  if (st) {
    if (sub) { st.textContent = sub.text; st.classList.remove('blank'); }
    else     { st.textContent = '—';      st.classList.add('blank'); }
  }
}

function fmt(s) {
  s = Math.max(0, s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=Math.floor(s%60);
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function p(n) { return String(n).padStart(2,'0'); }

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (S.screen === 'setup') { app.innerHTML = setupHTML(); bindSetup(); }
  else { app.innerHTML = playerHTML(); bindPlayer(); if (S.syncOpen) renderSyncOverlay(); }
}

function renderPlayerScreen() {
  const app = document.getElementById('app');
  app.innerHTML = playerHTML();
  bindPlayer();
  updatePlayerUI();
}

function setupHTML() {
  const ok = S.subs.length > 0;
  return `
    <div class="setup">
      <div class="logo"><h1>SubPlayer</h1><p>LECTEUR DE SOUS-TITRES</p></div>
      <div class="sec">
        <div class="lbl">FICHIER SRT</div>
        <label class="drop ${ok?'ok':''}">
          <input type="file" accept=".srt,.txt" id="srt-in">
          <div class="ico">${ok?'✅':'🎬'}</div>
          <div class="dtitle">${ok ? S.srtName : 'Charger un fichier SRT'}</div>
          <div class="dsub">${ok ? S.subs.length+' sous-titres · '+S.lang : 'Appuie ici pour sélectionner'}</div>
        </label>
      </div>
      ${ok ? '' : `
      <div class="sec">
        <div class="hint-box">
          <strong>Comment ça marche ?</strong><br>
          1. Charge un fichier .srt<br>
          2. Lance la vidéo sur ton écran<br>
          3. Dans le player, appuie sur 🎤 pour synchroniser automatiquement
        </div>
      </div>`}
    </div>
    <div class="launch-wrap">
      <button class="lbtn ${ok?'ready':''}" id="launch-btn" ${!ok?'disabled':''}>
        ▶&nbsp;&nbsp;Lancer
      </button>
    </div>`;
}

function playerHTML() {
  const total = S.subs[S.subs.length-1]?.end || 1;
  return `
    <div class="player">
      <div class="p-top">
        <button class="back" id="back">←</button>
        <span class="p-name">${S.srtName}</span>
        <span class="p-time" id="p-time">${fmt(S.currentTime)}</span>
      </div>
      <div class="sub-area">
        <div class="sub-text blank" id="sub-text">—</div>
      </div>
      <div class="nudge">
        <button class="nBtn" id="n-minus">− 0.5 s</button>
        <span class="nLbl">décalage fin</span>
        <button class="nBtn" id="n-plus">+ 0.5 s</button>
      </div>
      <div class="prog">
        <div class="prog-bar" id="prog-bar">
          <div class="prog-fill" id="p-fill"></div>
        </div>
        <div class="prog-times">
          <span id="p-elapsed">${fmt(S.currentTime)}</span>
          <span id="p-total">${fmt(total)}</span>
        </div>
      </div>
      <div class="ctrls">
        <div class="cw">
          <button class="cbtn sm" id="bk">⏪</button>
          <div class="clbl">−10 s</div>
        </div>
        <div class="cw">
          <button class="cbtn lg" id="pp">${S.isPlaying?'⏸':'▶'}</button>
        </div>
        <div class="cw">
          <button class="cbtn sm" id="fw">⏩</button>
          <div class="clbl">+10 s</div>
        </div>
      </div>
      <div class="sync-row">
        <button class="sync-row-btn" id="sync-btn">🎤&nbsp;&nbsp;Synchroniser</button>
      </div>
      <div class="sync-overlay hidden" id="sync-overlay"></div>
    </div>`;
}

// ─────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────
function bindSetup() {
  document.getElementById('srt-in').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      S.subs = parseSRT(ev.target.result);
      S.srtName = f.name.replace(/\.srt$/i,'');
      S.lang = detectLang(S.subs);
      render();
    };
    r.readAsText(f);
  });
  document.getElementById('launch-btn')?.addEventListener('click', () => {
    if (!S.subs.length) return;
    S.currentTime = 0; S.isPlaying = false; S.screen = 'player';
    render(); updatePlayerUI();
  });
}

function bindPlayer() {
  document.getElementById('back').addEventListener('click', () => {
    stopTimer(); stopSync(); S.isPlaying = false; S.screen = 'setup'; render();
  });
  document.getElementById('pp').addEventListener('click', () => {
    S.isPlaying = !S.isPlaying;
    document.getElementById('pp').textContent = S.isPlaying ? '⏸' : '▶';
    S.isPlaying ? startTimer() : stopTimer();
  });
  document.getElementById('bk').addEventListener('click', () => {
    S.currentTime = Math.max(0, S.currentTime-10); updatePlayerUI();
  });
  document.getElementById('fw').addEventListener('click', () => {
    S.currentTime += 10; updatePlayerUI();
  });
  document.getElementById('n-minus').addEventListener('click', () => {
    S.currentTime = Math.max(0, S.currentTime-.5); updatePlayerUI();
  });
  document.getElementById('n-plus').addEventListener('click', () => {
    S.currentTime += .5; updatePlayerUI();
  });
  document.getElementById('prog-bar').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    S.currentTime = (e.clientX - rect.left) / rect.width * (S.subs[S.subs.length-1]?.end || 1);
    updatePlayerUI();
  });
  document.getElementById('sync-btn').addEventListener('click', () => {
    stopTimer(); S.isPlaying = false;
    document.getElementById('pp').textContent = '▶';
    startSync();
  });
}

// ─────────────────────────────────────────
// PWA
// ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `const C='sp-v2';
    self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.pathname]))));
    self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(
    URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))
  ).catch(()=>{});
}

render();
</script>
