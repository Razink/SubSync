<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0d0f14">
  <title>SubPlayer</title>
  <style>
    :root {
      --bg: #0d0f14; --card: #161820; --card2: #1e202a;
      --gold: #c9a227; --gold2: #e6b84a;
      --text: #e8e8e8; --muted: #6b7280; --border: #2a2d3a;
      --green: #22c55e; --red: #ef4444; --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    #app { height: 100%; display: flex; flex-direction: column; }

    /* ── SETUP ── */
    .setup { flex: 1; overflow-y: auto; padding: 28px 20px 120px; }
    .logo { margin-bottom: 36px; }
    .logo h1 { font-size: 44px; font-style: italic; font-weight: 800;
      color: var(--gold); letter-spacing: -1px; line-height: 1; }
    .logo p { font-size: 11px; letter-spacing: 3px; color: var(--muted); margin-top: 6px; }
    .version-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #06B6D4; margin-left: 8px; vertical-align: middle;
      box-shadow: 0 0 6px #06B6D4; }
    .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
    .sec { margin-bottom: 28px; }
    .drop { border: 1.5px dashed var(--border); border-radius: var(--r);
      background: var(--card); padding: 32px 20px; text-align: center;
      cursor: pointer; position: relative; transition: border-color .2s, background .2s; }
    .drop.ok { border-color: var(--gold); background: rgba(201,162,39,.08); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop .ico { font-size: 38px; margin-bottom: 8px; }
    .drop .dtitle { font-size: 16px; font-weight: 500; }
    .drop .dsub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .drop.ok .dtitle { color: var(--gold); }
    .hint-box { background: var(--card); border-radius: var(--r); padding: 16px;
      font-size: 13px; color: var(--muted); line-height: 1.7; }
    .hint-box strong { color: var(--text); }
    .launch-wrap { position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 65%, transparent); }
    .lbtn { width: 100%; padding: 20px; border-radius: var(--r); border: none;
      background: var(--card2); color: var(--muted); font-size: 18px;
      font-style: italic; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .2s, color .2s; }
    .lbtn.ready { background: var(--gold); color: #000; }
    .lbtn.ready:active { background: var(--gold2); }

    /* ── PLAYER ── */
    .player { flex: 1; display: flex; flex-direction: column; background: #000; }
    .p-top { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
    .back { width: 44px; height: 44px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.1); color: var(--text); font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .p-name { font-size: 13px; color: var(--muted); max-width: 140px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-time { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Sync status pill */
    .sync-pill {
      display: none; align-items: center; gap: 6px;
      background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3);
      border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--green);
      font-weight: 600;
    }
    .sync-pill.on { display: flex; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* Adjusted ping */
    .adj-ping { position: absolute; top: 80px; right: 20px;
      background: rgba(34,197,94,.9); color: #000; font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; opacity: 0;
      transition: opacity .3s; pointer-events: none; }

    .sub-area { flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 20px; position: relative; }
    .sub-text { font-size: 30px; font-weight: 500; color: #fff; text-align: center;
      line-height: 1.45; text-shadow: 0 2px 10px rgba(0,0,0,.9); min-height: 80px; }
    .sub-text.blank { color: rgba(255,255,255,.12); font-size: 18px; }

    /* Waveform row — canvas + compact sync button */
    .waveform-row { display: flex; align-items: center; gap: 10px; padding: 0 20px 10px; }
    #waveform-canvas {
      flex: 1; height: 56px; border-radius: 10px;
      background: rgba(255,255,255,.04); cursor: pointer; display: block;
    }

    /* Sync button — 44×44 icon only */
    .sync-btn-el {
      width: 44px; height: 44px; border-radius: 12px;
      font-size: 20px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
      border: 1.5px solid rgba(34,197,94,.4);
      background: rgba(34,197,94,.1); color: var(--green);
    }
    .sync-btn-el.active { background: rgba(34,197,94,.25); border-color: var(--green); }
    .sync-btn-el:active { opacity: .75; }

    /* Fullscreen / cinema button */
    .fs-btn { width: 36px; height: 36px; border-radius: 8px; border: none;
      background: rgba(255,255,255,.08); color: var(--muted); font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; }
    .fs-btn:active { background: rgba(255,255,255,.2); }

    /* Cinema mode — texte seul sur fond noir */
    .player.cinema .p-top,
    .player.cinema .waveform-row,
    .player.cinema .debug-panel,
    .player.cinema .prog,
    .player.cinema .ctrls { display: none !important; }
    .player.cinema { background: #000; }
    .player.cinema .sub-area { padding: 0 28px; }
    .player.cinema .sub-text { font-size: 40px; line-height: 1.5; }
    .cinema-exit { display: none; position: absolute; top: 14px; right: 14px;
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.12); color: rgba(255,255,255,.5); font-size: 16px;
      cursor: pointer; align-items: center; justify-content: center; z-index: 10; }
    .player.cinema .cinema-exit { display: flex; }

    /* Debug panel — hidden, revealed by tapping waveform */
    .debug-panel { display: none; }
    .debug-panel.on { display: block; }

    /* Debug log */
    .sync-log {
      margin: 0 20px 10px; background: rgba(0,0,0,.6); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; max-height: 110px; overflow-y: auto;
      font-size: 12px; font-family: monospace; line-height: 1.7;
    }
    .sync-log .l-mic  { color: #60a5fa; }
    .sync-log .l-hear { color: var(--text); }
    .sync-log .l-key  { color: #fbbf24; }
    .sync-log .l-ok   { color: var(--green); font-weight: 700; }
    .sync-log .l-fail { color: #f87171; }
    .sync-log .l-info { color: var(--muted); }

    /* Manual input */
    .manual-row { display: flex; gap: 8px; padding: 0 20px 10px; }
    .manual-inp {
      flex: 1; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 14px;
      outline: none;
    }
    .manual-inp:focus { border-color: var(--gold); }
    .manual-inp::placeholder { color: var(--muted); }
    .manual-go {
      background: var(--gold); color: #000; border: none; border-radius: 10px;
      padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .manual-go:active { background: var(--gold2); }

    .prog { padding: 0 20px; margin-bottom: 6px; }
    .prog-bar { width: 100%; height: 4px; background: rgba(255,255,255,.15);
      border-radius: 2px; cursor: pointer; }
    .prog-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; }
    .prog-times { display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted); margin-top: 6px; }

    .ctrls { display: flex; align-items: center; justify-content: center;
      gap: 14px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); }
    .cw { display: flex; flex-direction: column; align-items: center; }
    .cbtn { border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .cbtn.sm { width: 52px; height: 52px; font-size: 18px;
      background: rgba(255,255,255,.08); color: var(--text); }
    .cbtn.sm:active { background: rgba(255,255,255,.2); }
    .cbtn.xs { width: 44px; height: 44px; font-size: 14px; font-weight: 600;
      background: rgba(255,255,255,.06); color: var(--muted); border: 1px solid var(--border); }
    .cbtn.xs:active { background: rgba(255,255,255,.15); }
    .cbtn.lg { width: 68px; height: 68px; font-size: 26px; background: var(--gold); color: #000; }
    .cbtn.lg:active { background: var(--gold2); }
    .clbl { font-size: 10px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const S = {
  screen: 'setup',
  subs: [], srtName: '', lang: 'fr-FR',
  currentTime: 0, isPlaying: false,
  syncActive: false,
  bigramIndex: null,
};

let timerRaf = null, lastTick = null;
let recognition = null;
let lastMatchAttempt = 0, lastSuccessfulMatch = 0, lastMatchTimeMs = 0;
let interimEventCount = 0, sessionStart = 0, metricsInterval = null;

// ─────────────────────────────────────────
// WAVEFORM VISUALIZATION
// ─────────────────────────────────────────
let waveAnimId = null;
let audioCtx = null, analyser = null, micStream = null;

function stopWave() {
  if (waveAnimId) { cancelAnimationFrame(waveAnimId); waveAnimId = null; }
  if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx)   { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
  analyser = null;
}

function startWaveIdle() {
  stopWave();
  const canvas = document.getElementById('waveform-canvas');
  if (!canvas) return;
  if (!canvas.offsetWidth) {
    waveAnimId = requestAnimationFrame(() => { waveAnimId = null; startWaveIdle(); });
    return;
  }
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight || 56;
  const ctx = canvas.getContext('2d');
  const N = 36, barW = canvas.width / N;
  let t = 0;

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const phase = (i / N) * Math.PI * 4;
      const v = 0.12 + 0.09 * Math.sin(t * 0.022 + phase)
                     + 0.04 * Math.sin(t * 0.041 + phase * 2.1);
      const barH = Math.max(2, v * H);
      ctx.globalAlpha = 0.28 + 0.18 * Math.sin(t * 0.03 + phase * 0.7);
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(i * barW + 1, (H - barH) / 2, Math.max(1, barW - 2), barH);
    }
    ctx.globalAlpha = 1;
    t++;
    waveAnimId = requestAnimationFrame(draw);
  }
  waveAnimId = requestAnimationFrame(draw);
}

async function startWaveActive() {
  stopWave();
  const canvas = document.getElementById('waveform-canvas');
  if (!canvas) return;
  canvas.width  = canvas.offsetWidth  || 280;
  canvas.height = canvas.offsetHeight || 56;
  const ctx = canvas.getContext('2d');
  const N = 36, barW = canvas.width / N;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    if (!S.syncActive) { micStream.getTracks().forEach(t => t.stop()); micStream = null; return; }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.78;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);

    const bins = analyser.frequencyBinCount;
    const data = new Uint8Array(bins);

    function drawActive() {
      if (!S.syncActive) return;
      analyser.getByteFrequencyData(data);
      const H = canvas.height;
      ctx.clearRect(0, 0, canvas.width, H);
      for (let i = 0; i < N; i++) {
        const val = data[Math.floor(i * bins / N)] / 255;
        const barH = Math.max(3, val * H * 0.9);
        ctx.globalAlpha = 0.45 + val * 0.55;
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(i * barW + 1, (H - barH) / 2, Math.max(1, barW - 2), barH);
      }
      ctx.globalAlpha = 1;
      waveAnimId = requestAnimationFrame(drawActive);
    }
    waveAnimId = requestAnimationFrame(drawActive);

  } catch(e) {
    // Fallback sans accès micro : barres vertes animées
    let t = 0;
    function drawFallback() {
      if (!S.syncActive) return;
      const H = canvas.height;
      ctx.clearRect(0, 0, canvas.width, H);
      for (let i = 0; i < N; i++) {
        const phase = (i / N) * Math.PI * 4;
        const v = 0.15 + 0.16 * Math.sin(t * 0.055 + phase)
                       + 0.07 * Math.sin(t * 0.09  + phase * 2.2);
        const barH = Math.max(3, v * H);
        ctx.globalAlpha = 0.5 + 0.35 * Math.sin(t * 0.07 + phase * 0.8);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(i * barW + 1, (H - barH) / 2, Math.max(1, barW - 2), barH);
      }
      ctx.globalAlpha = 1;
      t++;
      waveAnimId = requestAnimationFrame(drawFallback);
    }
    waveAnimId = requestAnimationFrame(drawFallback);
  }
}

// ─────────────────────────────────────────
// DEBUG LOG
// ─────────────────────────────────────────
function log(cls, msg) {
  const el = document.getElementById('sync-log');
  if (!el) return;
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  while (el.children.length > 20) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

// ─────────────────────────────────────────
// SRT PARSER
// ─────────────────────────────────────────
function parseSRT(txt) {
  const out = [];
  for (const block of txt.trim().split(/\n\s*\n/)) {
    const lines = block.trim().split('\n');
    const tl = lines.find(l => l.includes('-->'));
    if (!tl) continue;
    const m = tl.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/);
    if (!m) continue;
    const start = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
    const end   = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/1000;
    const text  = lines.slice(lines.indexOf(tl)+1).join('\n').replace(/<[^>]+>/g,'').trim();
    if (text) out.push({ start, end, text });
  }
  return out;
}

function detectLang(subs) {
  const s = subs.slice(0,30).map(x=>x.text).join(' ').toLowerCase();
  const fr = ['je','tu','il','elle','les','des','que','pas','une','est'].filter(w=>s.includes(' '+w+' ')).length;
  const en = ['the','and','you','that','this','with','have','from','were'].filter(w=>s.includes(' '+w+' ')).length;
  const ar = ['في','من','على','هذا','أن'].filter(w=>s.includes(w)).length;
  if (ar>1) return 'ar-SA';
  return fr>=en ? 'fr-FR' : 'en-US';
}

// ─────────────────────────────────────────
// TEXT MATCHING — bigrams + accent-insensitive
// ─────────────────────────────────────────
const STOP = new Set(['le','la','les','de','du','un','une','et','est','je','tu','il','elle',
  'nous','vous','ils','elles','en','au','se','sa','son','ce','si','ne','pas','que','qui','ca',
  'the','a','an','and','is','are','i','you','he','she','we','they','it','to','of','in',
  'that','was','for','on','with','as','but','not','be','so','do','no','my','me','him','her']);

function norm(text) {
  return text.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/['']/g,' ').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
}

function sig(text) {
  return norm(text).split(' ').filter(w => w.length > 2 && !STOP.has(w));
}

function score(tw, cw) {
  if (!tw.length || !cw.length) return 0;
  const cSet = new Set(cw);
  return tw.filter(w => cSet.has(w)).length / tw.length;
}

function extractBigrams(keywords) {
  const bigrams = [];
  for (let i = 0; i < keywords.length - 1; i++) {
    bigrams.push(keywords[i] + '_' + keywords[i + 1]);
  }
  for (const k of keywords) bigrams.push(k);
  return bigrams;
}

function buildBigramIndex(subs) {
  const index = new Map();
  subs.forEach((sub, blockIdx) => {
    const kws = sig(sub.text);
    const bgs = extractBigrams(kws);
    for (const bg of bgs) {
      let set = index.get(bg);
      if (!set) { set = new Set(); index.set(bg, set); }
      set.add(blockIdx);
    }
  });
  return index;
}

function aggregateWindow(votes, windowSize) {
  const agg = new Map();
  votes.forEach((count, blockIdx) => {
    for (let offset = -windowSize; offset <= windowSize; offset++) {
      const target = blockIdx + offset;
      agg.set(target, (agg.get(target) || 0) + count);
    }
  });
  return agg;
}

function tryMatch(spokenKeywords, currentTime) {
  if (!S.bigramIndex) return findMatchLegacy(spokenKeywords.join(' '), currentTime);
  const spokenBigrams = extractBigrams(spokenKeywords);
  if (spokenBigrams.length === 0) return null;

  const votes = new Map();
  for (const bg of spokenBigrams) {
    const candidates = S.bigramIndex.get(bg);
    if (!candidates) continue;
    candidates.forEach(blockIdx => {
      votes.set(blockIdx, (votes.get(blockIdx) || 0) + 1);
    });
  }
  if (votes.size === 0) return null;

  const windowed = aggregateWindow(votes, 3);

  let best = null;
  windowed.forEach((sc, centerIdx) => {
    const sub = S.subs[centerIdx];
    if (!sub) return;
    const recall = sc / spokenBigrams.length;
    const distance = Math.abs(sub.start - currentTime);
    const threshold = distance <= 90 ? 0.40 : 0.55;
    if (recall >= threshold && (!best || recall > best.score)) {
      best = { time: sub.start, score: recall, text: sub.text };
    }
  });

  if (!best) {
    let topIdx = -1, topScore = 0;
    windowed.forEach((sc, idx) => { if (sc > topScore) { topScore = sc; topIdx = idx; } });
    if (topIdx >= 0) {
      const sub = S.subs[topIdx];
      const recall = topScore / spokenBigrams.length;
      log('l-fail', `✗ Meilleur recall: ${recall.toFixed(2)} — "${sub.text.slice(0,40)}..."`);
    }
  }
  return best;
}

// Ancien matcher — fallback si l'index n'est pas construit
function findMatchLegacy(text, currentTime) {
  const tw = sig(text);
  if (tw.length < 2) return null;
  let bestNear = null, bestNearScore = 0;
  let bestFar  = null, bestFarScore  = 0;
  for (let W = 2; W <= 8; W++) {
    for (let i = 0; i <= S.subs.length - W; i++) {
      const chunk = S.subs.slice(i, i+W).map(s=>s.text).join(' ');
      const cw  = sig(chunk);
      const sc  = score(tw, cw);
      const dt  = Math.abs(S.subs[i].start - currentTime);
      const pos = { time: S.subs[i].start, score: sc, text: chunk };
      if (dt < 90) { if (sc > bestNearScore) { bestNearScore = sc; bestNear = pos; } }
      else         { if (sc > bestFarScore)  { bestFarScore  = sc; bestFar  = pos; } }
    }
  }
  if (bestNearScore >= 0.40) return bestNear;
  if (bestFarScore  >= 0.55) return bestFar;
  return null;
}

// ─────────────────────────────────────────
// SYNC
// ─────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleSync() {
  S.syncActive ? stopSync() : startSync();
}

let restartTimer = null;

async function startSync() {
  if (!SR) { alert('Reconnaissance vocale non disponible sur ce navigateur.'); return; }
  S.syncActive = true;
  // Reset métriques de session
  interimEventCount = 0;
  lastMatchAttempt = 0;
  lastMatchTimeMs = 0;
  lastSuccessfulMatch = 0;
  updateSyncBtn();
  log('l-info', `📊 Index: ${S.bigramIndex ? S.bigramIndex.size : 0} bigrams · ${S.subs.length} subs`);
  // Métriques roulantes toutes les 5s
  let lastCount = 0, lastTick = performance.now();
  clearInterval(metricsInterval);
  metricsInterval = setInterval(() => {
    if (!S.syncActive) return;
    const now = performance.now();
    const dt = (now - lastTick) / 1000;
    const rate = ((interimEventCount - lastCount) / dt).toFixed(1);
    lastCount = interimEventCount;
    lastTick = now;
    log('l-info', `📊 ${rate} interim/s · dernier match: ${lastMatchTimeMs.toFixed(1)}ms`);
  }, 5000);
  await startWaveActive(); // micro déjà actif → Chrome ne joue pas le ding au démarrage SR
  if (S.syncActive) launchRecognition();
}

function launchRecognition() {
  if (!S.syncActive) return;

  recognition = new SR();
  recognition.lang = S.lang;
  recognition.continuous = true;   // évite les ding répétés à chaque redémarrage
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    sessionStart = performance.now();
    log('l-mic', '🎤 Écoute...');
  };
  recognition.onspeechstart = () => log('l-mic', '🗣 Voix détectée');

  recognition.onresult = e => {
    interimEventCount++;

    // Accumule tout le transcript (interim + final) depuis début de session
    let fullTranscript = '';
    for (let i = 0; i < e.results.length; i++) {
      fullTranscript += e.results[i][0].transcript + ' ';
    }
    fullTranscript = fullTranscript.trim();
    if (!fullTranscript) return;

    const now = performance.now();

    // Session > 20s : reset (les anciens résultats ne sont plus pertinents)
    if (now - sessionStart > 20000) {
      log('l-info', '↻ Session > 20s — reset');
      try { recognition.stop(); } catch(err) {}
      return;
    }

    // Throttle à 4Hz max
    if (now - lastMatchAttempt < 250) return;
    lastMatchAttempt = now;

    const keywords = sig(fullTranscript);
    // Min 4 keywords sur auto pour éviter faux positifs sur interim court
    if (keywords.length < 4) return;

    log('l-hear', '💬 "' + fullTranscript.slice(-80) + '"');
    tryMatchAndApply(fullTranscript);
  };

  recognition.onnomatch = () => log('l-fail', '✗ Voix non reconnue');

  recognition.onerror = e => {
    if (e.error === 'not-allowed') { stopSync(); alert('Accès au micro refusé.'); return; }
    if (e.error === 'no-speech')   log('l-info', '— Silence, en attente...');
    else                           log('l-fail', '✗ Erreur: ' + e.error);
  };

  recognition.onend = () => {
    if (!S.syncActive) return;
    restartTimer = setTimeout(launchRecognition, 800);
  };

  try { recognition.start(); } catch(e) { log('l-fail', '✗ Impossible de démarrer: ' + e.message); }
}

function stopSync() {
  S.syncActive = false;
  clearTimeout(restartTimer);
  clearInterval(metricsInterval);
  metricsInterval = null;
  try { recognition?.stop(); } catch(e) {}
  recognition = null;
  log('l-info', '⏹ Sync arrêtée');
  updateSyncBtn();
  startWaveIdle();
}

function tryMatchAndApply(text) {
  const tw = sig(text);
  log('l-key', '🔑 Mots clés (' + tw.length + '): [' + tw.slice(0,10).join(', ') + (tw.length>10?'...':'') + ']');
  if (tw.length < 2) { log('l-fail', '✗ Pas assez de mots clés (<2)'); return; }

  const t0 = performance.now();
  const match = tryMatch(tw, S.currentTime);
  lastMatchTimeMs = performance.now() - t0;

  if (match) {
    const diff = match.time - S.currentTime;
    log('l-ok', `✓ Match @${fmt(match.time)} score:${match.score.toFixed(2)} Δ${diff>0?'+':''}${diff.toFixed(1)}s (${lastMatchTimeMs.toFixed(1)}ms)`);
    log('l-info', `  → "${match.text.slice(0, 50)}"`);
    if (Math.abs(diff) > 1.0) {
      S.currentTime = match.time + 2.0; // compense le délai d'interim (réduit depuis 4.5)
      updatePlayerUI();
      showPing((diff > 0 ? '+' : '') + diff.toFixed(1) + 's');
      if (!S.isPlaying) {
        S.isPlaying = true;
        startTimer();
        const pp = document.getElementById('pp');
        if (pp) pp.textContent = '⏸';
      }
    } else {
      log('l-info', '→ Déjà bon (Δ < 1s)');
    }
    lastSuccessfulMatch = performance.now();
    playBell();
    stopSync();
  }
}

function manualSync() {
  const inp = document.getElementById('manual-inp');
  if (!inp || !inp.value.trim()) return;
  const text = inp.value.trim();
  log('l-mic', '✍️ Manuel: "' + text + '"');
  tryMatchAndApply(text);
}

function updateSyncBtn() {
  const btn  = document.getElementById('sync-btn-el');
  const pill = document.getElementById('sync-pill');
  if (btn) {
    btn.className   = 'sync-btn-el' + (S.syncActive ? ' active' : '');
    btn.textContent = S.syncActive ? '⏹' : '🎤';
  }
  if (pill) pill.className = 'sync-pill' + (S.syncActive ? ' on' : '');
}

function showPing(label) {
  const el = document.getElementById('adj-ping');
  if (!el) return;
  el.textContent = '✓ ' + label;
  el.style.opacity = '1';
  setTimeout(() => { if (el) el.style.opacity = '0'; }, 1800);
}

function playBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1047, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.1);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 1.1);
  } catch(e) {}
}

function toggleCinema() {
  const player = document.querySelector('.player');
  if (!player) return;
  const on = player.classList.toggle('cinema');
  if (on) {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el).catch(() => {});
  } else {
    if (document.fullscreenElement || document.webkitFullscreenElement)
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document).catch(() => {});
  }
  updateFsBtn();
}

function updateFsBtn() {
  const btn = document.getElementById('fs-btn');
  if (!btn) return;
  const on = document.querySelector('.player.cinema');
  btn.innerHTML = on
    ? `<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M3.5 0H5v5H0V3.5h3.5V0zm4.5 0h1.5v3.5H13V5H8V0zM0 8h5v5H3.5V9.5H0V8zm8 0h5v1.5H9.5V13H8V8z"/></svg>`
    : `<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M0 0h4.5v1.5H1.5V4.5H0V0zm8.5 0H13v4.5h-1.5V1.5H8.5V0zM0 8.5h1.5V11.5H4.5V13H0V8.5zm11.5 3H8.5V13H13V8.5h-1.5V11.5z"/></svg>`;
}

// ─────────────────────────────────────────
// PLAYER TIMER
// ─────────────────────────────────────────
function startTimer() {
  lastTick = performance.now();
  function tick(now) {
    S.currentTime += (now - lastTick) / 1000;
    lastTick = now;
    updatePlayerUI();
    timerRaf = requestAnimationFrame(tick);
  }
  timerRaf = requestAnimationFrame(tick);
}
function stopTimer() {
  if (timerRaf) { cancelAnimationFrame(timerRaf); timerRaf = null; }
}

function updatePlayerUI() {
  const t = S.currentTime;
  const total = S.subs[S.subs.length-1]?.end || 1;
  const sub = S.subs.find(s => t >= s.start && t <= s.end);
  const el = id => document.getElementById(id);
  if (el('p-time'))    el('p-time').textContent = fmt(t);
  if (el('p-elapsed')) el('p-elapsed').textContent = fmt(t);
  if (el('p-total'))   el('p-total').textContent = fmt(total);
  if (el('p-fill'))    el('p-fill').style.width = Math.min(100, t/total*100) + '%';
  const st = el('sub-text');
  if (st) {
    if (sub) { st.textContent = sub.text; st.classList.remove('blank'); }
    else     { st.textContent = '—';      st.classList.add('blank'); }
  }
}

function fmt(s) {
  s = Math.max(0,s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=Math.floor(s%60);
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function p(n) { return String(n).padStart(2,'0'); }

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (S.screen === 'setup') { app.innerHTML = setupHTML(); bindSetup(); }
  else { app.innerHTML = playerHTML(); bindPlayer(); updatePlayerUI(); updateSyncBtn(); }
}

function setupHTML() {
  const ok = S.subs.length > 0;
  return `
    <div class="setup">
      <div class="logo"><h1>SubPlayer<span class="version-dot"></span></h1><p>LECTEUR DE SOUS-TITRES</p></div>
      <div class="sec">
        <div class="lbl">FICHIER SRT</div>
        <label class="drop ${ok?'ok':''}">
          <input type="file" accept=".srt,.txt" id="srt-in">
          <div class="ico">${ok?'✅':'🎬'}</div>
          <div class="dtitle">${ok ? S.srtName : 'Charger un fichier SRT'}</div>
          <div class="dsub">${ok ? S.subs.length+' sous-titres · '+S.lang : 'Appuie ici pour sélectionner'}</div>
        </label>
      </div>
      ${ok ? '' : `<div class="sec"><div class="hint-box">
        <strong>Comment utiliser</strong><br>
        1. Charge un fichier .srt<br>
        2. Lance la vidéo sur ton écran<br>
        3. Appuie sur <strong>Lancer</strong> puis <strong>🎤</strong> pour synchroniser<br>
        La sync s'arrête automatiquement après un match
      </div></div>`}
    </div>
    <div class="launch-wrap">
      <button class="lbtn ${ok?'ready':''}" id="launch-btn" ${!ok?'disabled':''}>▶&nbsp;&nbsp;Lancer</button>
    </div>`;
}

function playerHTML() {
  const total = S.subs[S.subs.length-1]?.end || 1;
  return `
    <div class="player">
      <div class="p-top">
        <button class="back" id="back">←</button>
        <span class="p-name">${S.srtName}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="sync-pill" id="sync-pill"><div class="sync-dot"></div>SYNC</div>
          <span class="p-time" id="p-time">${fmt(S.currentTime)}</span>
          <button class="fs-btn" id="fs-btn"></button>
        </div>
      </div>

      <div class="sub-area">
        <div class="sub-text blank" id="sub-text">—</div>
        <div class="adj-ping" id="adj-ping"></div>
        <button class="cinema-exit" id="cinema-exit">✕</button>
      </div>

      <div class="waveform-row">
        <canvas id="waveform-canvas"></canvas>
        <button class="sync-btn-el" id="sync-btn-el">🎤</button>
      </div>

      <div class="debug-panel" id="debug-panel">
        <div class="sync-log" id="sync-log"></div>
        <div class="manual-row">
          <input class="manual-inp" id="manual-inp" type="text"
            placeholder="Tape quelques mots pour synchro...">
          <button class="manual-go" id="manual-go">OK</button>
        </div>
      </div>

      <div class="prog">
        <div class="prog-bar" id="prog-bar">
          <div class="prog-fill" id="p-fill"></div>
        </div>
        <div class="prog-times">
          <span id="p-elapsed">${fmt(S.currentTime)}</span>
          <span id="p-total">${fmt(total)}</span>
        </div>
      </div>

      <div class="ctrls">
        <div class="cw">
          <button class="cbtn sm" id="bk">⏪</button>
          <div class="clbl">−10 s</div>
        </div>
        <div class="cw">
          <button class="cbtn xs" id="n-minus">−0.5s</button>
          <div class="clbl">décalage</div>
        </div>
        <div class="cw">
          <button class="cbtn lg" id="pp">${S.isPlaying?'⏸':'▶'}</button>
        </div>
        <div class="cw">
          <button class="cbtn xs" id="n-plus">+0.5s</button>
          <div class="clbl">décalage</div>
        </div>
        <div class="cw">
          <button class="cbtn sm" id="fw">⏩</button>
          <div class="clbl">+10 s</div>
        </div>
      </div>
    </div>`;
}

// ─────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────
function bindSetup() {
  document.getElementById('srt-in').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      S.subs = parseSRT(ev.target.result);
      S.srtName = f.name.replace(/\.srt$/i,'');
      S.lang = detectLang(S.subs);
      const t0 = performance.now();
      S.bigramIndex = buildBigramIndex(S.subs);
      console.log(`[subsync] Index bigram: ${S.bigramIndex.size} entrées en ${(performance.now()-t0).toFixed(1)}ms pour ${S.subs.length} subs`);
      render();
    };
    r.readAsText(f);
  });
  document.getElementById('launch-btn')?.addEventListener('click', () => {
    if (!S.subs.length) return;
    S.currentTime = 0; S.isPlaying = false; S.screen = 'player'; render();
  });
}

function bindPlayer() {
  document.getElementById('back').addEventListener('click', () => {
    stopTimer(); stopSync(); stopWave(); S.isPlaying = false; S.screen = 'setup'; render();
  });
  document.getElementById('pp').addEventListener('click', () => {
    S.isPlaying = !S.isPlaying;
    document.getElementById('pp').textContent = S.isPlaying ? '⏸' : '▶';
    S.isPlaying ? startTimer() : stopTimer();
  });
  document.getElementById('bk').addEventListener('click', () => {
    S.currentTime = Math.max(0, S.currentTime-10); updatePlayerUI();
  });
  document.getElementById('fw').addEventListener('click', () => {
    S.currentTime += 10; updatePlayerUI();
  });
  document.getElementById('n-minus').addEventListener('click', () => {
    S.currentTime = Math.max(0, S.currentTime-.5); updatePlayerUI();
  });
  document.getElementById('n-plus').addEventListener('click', () => {
    S.currentTime += .5; updatePlayerUI();
  });
  document.getElementById('prog-bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    S.currentTime = (e.clientX - r.left) / r.width * (S.subs[S.subs.length-1]?.end || 1);
    updatePlayerUI();
  });
  document.getElementById('sync-btn-el').addEventListener('click', toggleSync);
  document.getElementById('manual-go').addEventListener('click', manualSync);
  document.getElementById('manual-inp').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualSync();
  });
  document.getElementById('waveform-canvas').addEventListener('click', () => {
    document.getElementById('debug-panel')?.classList.toggle('on');
  });
  document.getElementById('fs-btn').addEventListener('click', toggleCinema);
  document.getElementById('cinema-exit').addEventListener('click', toggleCinema);
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement)
      document.querySelector('.player')?.classList.remove('cinema');
    updateFsBtn();
  });
  document.addEventListener('webkitfullscreenchange', () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement)
      document.querySelector('.player')?.classList.remove('cinema');
    updateFsBtn();
  });

  updateFsBtn();
  startWaveIdle();
}

// ─────────────────────────────────────────
// PWA
// ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `const C='sp-v8';
    self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.pathname]))));
    self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(
    URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))
  ).catch(()=>{});
}

render();
</script>

</html>
