<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0d0f14">
  <title>SubPlayer</title>
  <style>
    :root {
      --bg: #0d0f14; --card: #161820; --card2: #1e202a;
      --gold: #c9a227; --gold2: #e6b84a;
      --text: #e8e8e8; --muted: #6b7280; --border: #2a2d3a;
      --green: #22c55e; --red: #ef4444; --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    #app { height: 100%; display: flex; flex-direction: column; }

    /* ── SETUP ── */
    .setup { flex: 1; overflow-y: auto; padding: 28px 20px 120px; }
    .logo { margin-bottom: 36px; }
    .logo h1 { font-size: 44px; font-style: italic; font-weight: 800;
      color: var(--gold); letter-spacing: -1px; line-height: 1; }
    .logo p { font-size: 11px; letter-spacing: 3px; color: var(--muted); margin-top: 6px; }
    .version-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #EF4444; margin-left: 8px; vertical-align: middle;
      box-shadow: 0 0 6px #EF4444; }
    .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
    .sec { margin-bottom: 28px; }
    .drop { border: 1.5px dashed var(--border); border-radius: var(--r);
      background: var(--card); padding: 32px 20px; text-align: center;
      cursor: pointer; position: relative; transition: border-color .2s, background .2s; }
    .drop.ok { border-color: var(--gold); background: rgba(201,162,39,.08); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop .ico { font-size: 38px; margin-bottom: 8px; }
    .drop .dtitle { font-size: 16px; font-weight: 500; }
    .drop .dsub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .drop.ok .dtitle { color: var(--gold); }
    .hint-box { background: var(--card); border-radius: var(--r); padding: 16px;
      font-size: 13px; color: var(--muted); line-height: 1.7; }
    .hint-box strong { color: var(--text); }
    .launch-wrap { position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 65%, transparent); }
    .lbtn { width: 100%; padding: 20px; border-radius: var(--r); border: none;
      background: var(--card2); color: var(--muted); font-size: 18px;
      font-style: italic; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .2s, color .2s; }
    .lbtn.ready { background: var(--gold); color: #000; }
    .lbtn.ready:active { background: var(--gold2); }

    /* ── PLAYER ── */
    .player { flex: 1; display: flex; flex-direction: column; background: #000; }
    .p-top { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
    .back { width: 44px; height: 44px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.1); color: var(--text); font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .p-name { font-size: 13px; color: var(--muted); max-width: 140px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-time { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Sync status pill — top right */
    .sync-pill {
      display: none; align-items: center; gap: 6px;
      background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3);
      border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--green);
      font-weight: 600;
    }
    .sync-pill.on { display: flex; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* Adjusted ping */
    .adj-ping { position: absolute; top: 80px; right: 20px;
      background: rgba(34,197,94,.9); color: #000; font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; opacity: 0;
      transition: opacity .3s; pointer-events: none; }

    .sub-area { flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 20px; position: relative; }
    .sub-text { font-size: 30px; font-weight: 500; color: #fff; text-align: center;
      line-height: 1.45; text-shadow: 0 2px 10px rgba(0,0,0,.9); min-height: 80px; }
    .sub-text.blank { color: rgba(255,255,255,.12); font-size: 18px; }

    /* Sync button — full width, prominent */
    .sync-row { padding: 0 20px 10px; }
    .sync-btn-el {
      width: 100%; padding: 15px; border-radius: var(--r);
      font-size: 16px; font-weight: 600; letter-spacing: .3px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .15s, border-color .15s;
      border: 1.5px solid rgba(34,197,94,.4);
      background: rgba(34,197,94,.1); color: var(--green);
    }
    .sync-btn-el.active {
      background: rgba(34,197,94,.2); border-color: var(--green); color: var(--green);
    }
    .sync-btn-el:active { opacity: .8; }

    .prog { padding: 0 20px; margin-bottom: 6px; }
    .prog-bar { width: 100%; height: 4px; background: rgba(255,255,255,.15);
      border-radius: 2px; cursor: pointer; }
    .prog-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; }
    .prog-times { display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted); margin-top: 6px; }

    .ctrls { display: flex; align-items: center; justify-content: center;
      gap: 14px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); }
    .cw { display: flex; flex-direction: column; align-items: center; }
    .cbtn { border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .cbtn.sm { width: 52px; height: 52px; font-size: 18px;
      background: rgba(255,255,255,.08); color: var(--text); }
    .cbtn.sm:active { background: rgba(255,255,255,.2); }
    .cbtn.xs { width: 44px; height: 44px; font-size: 14px; font-weight: 600;
      background: rgba(255,255,255,.06); color: var(--muted); border: 1px solid var(--border); }
    .cbtn.xs:active { background: rgba(255,255,255,.15); }
    .cbtn.lg { width: 68px; height: 68px; font-size: 26px; background: var(--gold); color: #000; }
    .cbtn.lg:active { background: var(--gold2); }
    .clbl { font-size: 10px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const S = {
  screen: 'setup',
  subs: [], srtName: '', lang: 'fr-FR',
  currentTime: 0, isPlaying: false,
  syncActive: false,
};

let timerRaf = null, lastTick = null;
let recognition = null;

// ─────────────────────────────────────────
// SRT PARSER
// ─────────────────────────────────────────
function parseSRT(txt) {
  const out = [];
  for (const block of txt.trim().split(/\n\s*\n/)) {
    const lines = block.trim().split('\n');
    const tl = lines.find(l => l.includes('-->'));
    if (!tl) continue;
    const m = tl.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/);
    if (!m) continue;
    const start = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
    const end   = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/1000;
    const text  = lines.slice(lines.indexOf(tl)+1).join('\n').replace(/<[^>]+>/g,'').trim();
    if (text) out.push({ start, end, text });
  }
  return out;
}

function detectLang(subs) {
  const s = subs.slice(0,30).map(x=>x.text).join(' ').toLowerCase();
  const fr = ['je','tu','il','elle','les','des','que','pas','une','est'].filter(w=>s.includes(' '+w+' ')).length;
  const en = ['the','and','you','that','this','with','have','from','were'].filter(w=>s.includes(' '+w+' ')).length;
  const ar = ['في','من','على','هذا','أن'].filter(w=>s.includes(w)).length;
  if (ar>1) return 'ar-SA';
  return fr>=en ? 'fr-FR' : 'en-US';
}

// ─────────────────────────────────────────
// TEXT MATCHING — bigrams + accent-insensitive
// ─────────────────────────────────────────
const STOP = new Set(['le','la','les','de','du','un','une','et','est','je','tu','il','elle',
  'nous','vous','ils','elles','en','au','se','sa','son','ce','si','ne','pas','que','qui','ca',
  'the','a','an','and','is','are','i','you','he','she','we','they','it','to','of','in',
  'that','was','for','on','with','as','but','not','be','so','do','no','my','me','him','her']);

function norm(text) {
  return text.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // strip accents
    .replace(/['']/g,' ').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
}

function sig(text) {
  return norm(text).split(' ').filter(w => w.length > 2 && !STOP.has(w));
}

function bigrams(words) {
  const out = new Set();
  for (let i = 0; i < words.length - 1; i++) out.add(words[i]+'|'+words[i+1]);
  return out;
}

function score(tw, cw) {
  if (!tw.length || !cw.length) return 0;
  const tSet = new Set(tw), cSet = new Set(cw);
  const tBi = bigrams(tw), cBi = bigrams(cw);
  const uni = tw.filter(w => cSet.has(w)).length / Math.max(tw.length, 1);
  let bi = 0;
  for (const b of tBi) { if (cBi.has(b)) bi++; }
  bi /= Math.max(tBi.size, 1);
  return uni * 0.35 + bi * 0.65; // bigrams weighted more
}

function findMatch(text, currentTime) {
  const tw = sig(text);
  if (tw.length < 2) return null;

  let bestNear = null, bestNearScore = 0;
  let bestFar  = null, bestFarScore  = 0;

  for (let W = 2; W <= 5; W++) {
    for (let i = 0; i <= S.subs.length - W; i++) {
      const cw  = sig(S.subs.slice(i, i+W).map(s=>s.text).join(' '));
      const sc  = score(tw, cw);
      const dt  = Math.abs(S.subs[i].start - currentTime);
      const pos = { time: S.subs[i].start, score: sc };
      if (dt < 90) { if (sc > bestNearScore) { bestNearScore = sc; bestNear = pos; } }
      else         { if (sc > bestFarScore)  { bestFarScore  = sc; bestFar  = pos; } }
    }
  }

  // Nearby match is easier to trust (lower threshold)
  if (bestNearScore >= 0.15) return bestNear;
  // Full-file match needs more confidence to avoid wild jumps
  if (bestFarScore  >= 0.30) return bestFar;
  return null;
}

// ─────────────────────────────────────────
// CONTINUOUS SYNC
// ─────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleSync() {
  S.syncActive ? stopSync() : startSync();
}

function startSync() {
  if (!SR) { alert('Reconnaissance vocale non disponible sur ce navigateur.'); return; }

  S.syncActive = true;
  updateSyncBtn();

  recognition = new SR();
  recognition.lang = S.lang;
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const text = e.results[i][0].transcript;
      const match = findMatch(text, S.currentTime);
      if (match) {
        const diff = match.time - S.currentTime;
        if (Math.abs(diff) > 1.0) {
          S.currentTime = match.time;
          showPing((diff > 0 ? '+' : '') + diff.toFixed(1) + 's');
        }
      }
    }
  };

  // Auto-restart when recognition stops (Chrome times out ~60s)
  recognition.onend = () => { if (S.syncActive) { setTimeout(()=>{ try { recognition.start(); } catch(e){} }, 150); } };
  recognition.onerror = e => {
    if (e.error === 'not-allowed') { stopSync(); alert('Accès au micro refusé.'); }
    // network / aborted → onend will restart
  };

  try { recognition.start(); } catch(e) {}
}

function stopSync() {
  S.syncActive = false;
  try { recognition?.stop(); } catch(e) {}
  recognition = null;
  updateSyncBtn();
}

function updateSyncBtn() {
  const btn = document.getElementById('sync-btn-el');
  const pill = document.getElementById('sync-pill');
  if (btn) {
    btn.className = 'sync-btn-el' + (S.syncActive ? ' active' : '');
    btn.innerHTML = S.syncActive
      ? '<span style="width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1s infinite;display:inline-block"></span>&nbsp;&nbsp;Sync actif — appuie pour arrêter'
      : '🎤&nbsp;&nbsp;Synchroniser';
  }
  if (pill) pill.className = 'sync-pill' + (S.syncActive ? ' on' : '');
}

function showPing(label) {
  const el = document.getElementById('adj-ping');
  if (!el) return;
  el.textContent = '✓ ' + label;
  el.style.opacity = '1';
  setTimeout(() => { if(el) el.style.opacity = '0'; }, 1800);
}

// ─────────────────────────────────────────
// PLAYER TIMER
// ─────────────────────────────────────────
function startTimer() {
  lastTick = performance.now();
  function tick(now) {
    S.currentTime += (now - lastTick) / 1000;
    lastTick = now;
    updatePlayerUI();
    timerRaf = requestAnimationFrame(tick);
  }
  timerRaf = requestAnimationFrame(tick);
}
function stopTimer() {
  if (timerRaf) { cancelAnimationFrame(timerRaf); timerRaf = null; }
}

function updatePlayerUI() {
  const t = S.currentTime;
  const total = S.subs[S.subs.length-1]?.end || 1;
  const sub = S.subs.find(s => t >= s.start && t <= s.end);
  const el = id => document.getElementById(id);
  if (el('p-time'))    el('p-time').textContent = fmt(t);
  if (el('p-elapsed')) el('p-elapsed').textContent = fmt(t);
  if (el('p-total'))   el('p-total').textContent = fmt(total);
  if (el('p-fill'))    el('p-fill').style.width = Math.min(100, t/total*100) + '%';
  const st = el('sub-text');
  if (st) {
    if (sub) { st.textContent = sub.text; st.classList.remove('blank'); }
    else     { st.textContent = '—';      st.classList.add('blank'); }
  }
}

function fmt(s) {
  s = Math.max(0,s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=Math.floor(s%60);
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function p(n) { return String(n).padStart(2,'0'); }

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (S.screen === 'setup') { app.innerHTML = setupHTML(); bindSetup(); }
  else { app.innerHTML = playerHTML(); bindPlayer(); updatePlayerUI(); updateSyncBtn(); }
}

function setupHTML() {
  const ok = S.subs.length > 0;
  return `
    <div class="setup">
      <div class="logo"><h1>SubPlayer<span class="version-dot"></span></h1><p>LECTEUR DE SOUS-TITRES</p></div>
      <div class="sec">
        <div class="lbl">FICHIER SRT</div>
        <label class="drop ${ok?'ok':''}">
          <input type="file" accept=".srt,.txt" id="srt-in">
          <div class="ico">${ok?'✅':'🎬'}</div>
          <div class="dtitle">${ok ? S.srtName : 'Charger un fichier SRT'}</div>
          <div class="dsub">${ok ? S.subs.length+' sous-titres · '+S.lang : 'Appuie ici pour sélectionner'}</div>
        </label>
      </div>
      ${ok ? '' : `<div class="sec"><div class="hint-box">
        <strong>Comment utiliser</strong><br>
        1. Charge un fichier .srt<br>
        2. Lance la vidéo sur ton écran<br>
        3. Appuie sur <strong>Lancer</strong> puis <strong>🎤 Synchroniser</strong><br>
        La sync tourne en continu et se corrige toute seule
      </div></div>`}
    </div>
    <div class="launch-wrap">
      <button class="lbtn ${ok?'ready':''}" id="launch-btn" ${!ok?'disabled':''}>▶&nbsp;&nbsp;Lancer</button>
    </div>`;
}

function playerHTML() {
  const total = S.subs[S.subs.length-1]?.end || 1;
  return `
    <div class="player">
      <div class="p-top">
        <button class="back" id="back">←</button>
        <span class="p-name">${S.srtName}</span>
        <div class="sync-pill" id="sync-pill">
          <div class="sync-dot"></div>SYNC
        </div>
        <span class="p-time" id="p-time">${fmt(S.currentTime)}</span>
      </div>

      <div class="sub-area">
        <div class="sub-text blank" id="sub-text">—</div>
        <div class="adj-ping" id="adj-ping"></div>
      </div>

      <div class="sync-row">
        <button class="sync-btn-el" id="sync-btn-el">🎤&nbsp;&nbsp;Synchroniser</button>
      </div>

      <div class="prog">
        <div class="prog-bar" id="prog-bar">
          <div class="prog-fill" id="p-fill"></div>
        </div>
        <div class="prog-times">
          <span id="p-elapsed">${fmt(S.currentTime)}</span>
          <span id="p-total">${fmt(total)}</span>
        </div>
      </div>

      <div class="ctrls">
        <div class="cw">
          <button class="cbtn sm" id="bk">⏪</button>
          <div class="clbl">−10 s</div>
        </div>
        <div class="cw">
          <button class="cbtn xs" id="n-minus">−0.5s</button>
          <div class="clbl">décalage</div>
        </div>
        <div class="cw">
          <button class="cbtn lg" id="pp">${S.isPlaying?'⏸':'▶'}</button>
        </div>
        <div class="cw">
          <button class="cbtn xs" id="n-plus">+0.5s</button>
          <div class="clbl">décalage</div>
        </div>
        <div class="cw">
          <button class="cbtn sm" id="fw">⏩</button>
          <div class="clbl">+10 s</div>
        </div>
      </div>
    </div>`;
}

// ─────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────
function bindSetup() {
  document.getElementById('srt-in').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      S.subs = parseSRT(ev.target.result);
      S.srtName = f.name.replace(/\.srt$/i,'');
      S.lang = detectLang(S.subs);
      render();
    };
    r.readAsText(f);
  });
  document.getElementById('launch-btn')?.addEventListener('click', () => {
    if (!S.subs.length) return;
    S.currentTime = 0; S.isPlaying = false; S.screen = 'player'; render();
  });
}

function bindPlayer() {
  document.getElementById('back').addEventListener('click', () => {
    stopTimer(); stopSync(); S.isPlaying = false; S.screen = 'setup'; render();
  });
  document.getElementById('pp').addEventListener('click', () => {
    S.isPlaying = !S.isPlaying;
    document.getElementById('pp').textContent = S.isPlaying ? '⏸' : '▶';
    S.isPlaying ? startTimer() : stopTimer();
  });
  document.getElementById('bk').addEventListener('click', () => {
    S.currentTime = Math.max(0, S.currentTime-10); updatePlayerUI();
  });
  document.getElementById('fw').addEventListener('click', () => {
    S.currentTime += 10; updatePlayerUI();
  });
  document.getElementById('n-minus').addEventListener('click', () => {
    S.currentTime = Math.max(0, S.currentTime-.5); updatePlayerUI();
  });
  document.getElementById('n-plus').addEventListener('click', () => {
    S.currentTime += .5; updatePlayerUI();
  });
  document.getElementById('prog-bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    S.currentTime = (e.clientX - r.left) / r.width * (S.subs[S.subs.length-1]?.end || 1);
    updatePlayerUI();
  });
  document.getElementById('sync-btn-el').addEventListener('click', toggleSync);
}

// ─────────────────────────────────────────
// PWA
// ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `const C='sp-v3';
    self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.pathname]))));
    self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(
    URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))
  ).catch(()=>{});
}

render();
</script>
</body>
</html>
